name: TeleDrive CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: teledrive/package-lock.json

    - name: Install dependencies
      run: |
        cd teledrive
        npm ci

    - name: Run Build
      run: |
        cd teledrive
        # Disable auto-spawning python backend during build
        export NEXT_PRIVATE_WORKER=true
        npm run build
